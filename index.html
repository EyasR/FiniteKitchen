<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chester's Infinite Kitchen</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <header class="site-header">
        <img
            src="chesterheader.jpg"
            alt="Chester's Infinite Kitchen"
            class="header-image"
        />
    </header>

    <div class="game-board">
        <h3>1. Base Ingredients</h3>
        <div id="ingredient-buttons">
            <button onclick="addIngredient('🍞')">🍞 Bread</button>
            <button onclick="addIngredient('🧀')">🧀 Cheese</button>
            <button onclick="addIngredient('🥩')">🥩 Meat</button>
            <button onclick="addIngredient('🍅')">🍅 Tomato</button>
            <button onclick="addIngredient('🦐')">🦐 Shrimp</button>
            <button onclick="addIngredient('🍚')">🍚 Rice</button>
        </div>

        <h3 id="crafted-title" style="display: none;">✨ Crafted Ingredients</h3>
        <div id="crafted-buttons"></div>

        <h3>2. Mixing Bowl</h3>
        <div id="mixing-bowl">
            <span id="slot1">❓</span> +
            <span id="slot2">❓</span> +
            <span id="slot3">❓</span>
        </div>

        <div class="action-buttons">
            <button id="mix-btn" onclick="mix()">Cook It! 🔥</button>
            <button id="clear-btn" onclick="clearBowl(true)">Clear 🗑️</button>
        </div>

        <h3>3. Result</h3>
        <div id="result">🍽️ Waiting for ingredients...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
